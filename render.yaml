# render.yaml — Render Blueprint for NyayaDepaaAI
# Two services: Auth Backend + AI Chatbot
# NOTE: Set secret env vars via Render Dashboard > Environment

services:
  # ── Service 1: Auth Backend (login, admin dashboard API) ──
  - type: web
    name: nyayadepaaai-api
    runtime: python
    region: singapore
    plan: free
    rootDir: auth_app/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: DATABASE_URL
        sync: false     # Set in Render Dashboard
      - key: JWT_SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://nyayadepaaai.vercel.app"
      - key: FRONTEND_URL
        value: "https://nyayadepaaai.vercel.app"
      - key: PYTHON_VERSION
        value: "3.10.0"
    healthCheckPath: /api/health

  # ── Service 2: AI Chatbot (legal advisor RAG pipeline) ──
  - type: web
    name: nyayadepaaai-chat
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r ai_requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PINECONE_API_KEY
        sync: false     # Set in Render Dashboard
      - key: PINECONE_INDEX_NAME
        value: "nyayadepaa"
      - key: JINA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.10.0"
    healthCheckPath: /api/health
