# ============================================================
# Continued PreTraining Configuration
# Fill all ### PLACEHOLDERS ### before running
# ============================================================

model:
  base_model_id: "meta-llama/Meta-Llama-3-8B"      # or Meta-Llama-3-70B
  # base_model_id: ### YOUR_CUSTOM_MODEL_PATH ###    # uncomment to use local path
  torch_dtype: "bfloat16"
  use_flash_attention: true                          # requires flash-attn package
  trust_remote_code: true

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

lora:                                # QLoRA adapters for CPT
  r: 64
  lora_alpha: 128
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  train_file: "../data/processed/cpt_train.jsonl"
  val_file:   "../data/processed/cpt_validation.jsonl"
  max_seq_length: 2048
  dataset_num_proc: 4

training:
  output_dir: "../outputs/cpt_model"              # ### CHANGE IF NEEDED ###
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8                  # effective batch = 2 * 8 = 16
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  fp16: false
  bf16: true
  logging_steps: 10
  eval_steps: 200
  save_steps: 200
  save_total_limit: 3
  evaluation_strategy: "steps"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  report_to: "wandb"                              # set to "none" to disable
  run_name: "legal-llama3-cpt"

packing: true                                     # pack short samples together for efficiency
